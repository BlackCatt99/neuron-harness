name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        shell: pwsh
        run: |
          $PSVersionTable | Out-String
          "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          "Paths: [IO.Path]::DirectorySeparatorChar = $([IO.Path]::DirectorySeparatorChar)"

      - name: 集成测试（28 组）
        shell: pwsh
        run: ./tests/e2e.ps1

      - name: Project integration regression
        shell: pwsh
        run: ./tests/integration.tests.ps1

      - name: Prompt hook regression
        shell: pwsh
        run: ./tests/prompt-hook.tests.ps1

      - name: 失败时保留测试现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/cr-e2e-*
          if-no-files-found: ignore
          retention-days: 7
